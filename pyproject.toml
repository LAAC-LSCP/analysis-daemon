[project]
name = "analysis-daemon"
version = "0.1.0"
description = "A Python-based daemon that periodically checks and schedules tasks from Echolalia"
authors = [
    {name = "Lawrence Borst",email = "laurens.s.borst@gmail.com"},
    {name = "Loann Peurey",email = "loann.peurey@ens.psl.eu"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click (>=8.2.1,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
packages = [
    {include = "src"}
]
include = ["CONFIG"]


[tool.poetry.scripts]
run-daemon = "src.cli.run_daemon:run_daemon"