log_directory = "./log"
conda_executable = "./activate"
echolalia_folder = "./echolalia"
script_wrapper = ""

[database]
url = "sqlite:///database.db"

[http]
base_url = "https://localhost"
client_id = "analytics-service"
client_secret = "MY_SECRET"

[jobs]
handler = "slurm"
partition = "echolalia"
use_slurm = false

[[scripts]]
name = "run alice"
python_script_path = "./scripts/run_alice.sh"
model_name = "alice"
bash_script_path = "./apply_alice.sh"
env_name = "ALICE"

[[scripts]]
name = "run vtc"
python_script_path = "" # NOTE: uses the real script (see conftest.py)
model_name = "vtc"
bash_script_path = "./apply_vtc.sh" # uses a fake one
env_name = "pyannote"
